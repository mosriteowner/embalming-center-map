name: update-map

on:
  schedule:
    - cron: "0 21 * * 0"      # 毎週日曜 21:00 UTC = 月曜 06:00 JST
  workflow_dispatch:           # 手動実行（初回はこれで実行）

permissions:
  contents: write

concurrency:
  group: update-map
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 日本語フォントを導入（PNG出力用）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk libcairo2

      - run: pip install -r requirements.txt pytest

      - name: テスト（パーサーの検算ロジック）
        run: python -m pytest -q tests

      - name: IFSAページを取得して地図を更新
        run: python src/update.py        # 検算に失敗するとここで失敗 → GitHubから通知メール

      - name: 変更をコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/history.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: update center map ($(date -u +%F))"
            git push
          fi
