name: wayback-history

# 手動実行専用です（自動では動きません）。
# Actions → 「wayback-history」→「Run workflow」で実行します。
on:
  workflow_dispatch:
    inputs:
      yearly:
        description: "年に1件（その年の最後の保存＝年末時点）だけ取得する"
        type: boolean
        default: true
      limit:
        description: "試験用: 先頭から何件だけ処理するか（空欄なら全件）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: wayback-history
  cancel-in-progress: false

jobs:
  wayback:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest

      - name: テスト
        run: python -m pytest -q tests

      - name: Wayback Machine から推移を取得
        env:
          LIMIT: ${{ inputs.limit }}
          YEARLY: ${{ inputs.yearly }}
        run: |
          ARGS=""
          if [ "$YEARLY" = "true" ]; then ARGS="$ARGS --yearly"; fi
          if [ -n "$LIMIT" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          python tools/wayback_history.py $ARGS

      - name: 結果を保存（JSON）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wayback_history.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: wayback history ($(date -u +%F))"
            git push
          fi
